[workspace]
resolver = "3"
members = [
  "crates/coqui-core",
  "crates/coqui-store",
  "crates/coqui-crawl",
  "crates/coqui-audit",
  "crates/coqui-render",
  "crates/coqui-lighthouse",
  "crates/coqui-cli",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
coqui-core = { path = "crates/coqui-core" }
coqui-store = { path = "crates/coqui-store" }
coqui-crawl = { path = "crates/coqui-crawl" }
coqui-audit = { path = "crates/coqui-audit" }
coqui-render = { path = "crates/coqui-render" }
coqui-lighthouse = { path = "crates/coqui-lighthouse" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", features = ["connect"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }
csv = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "charset", "http2", "gzip", "brotli", "json"] }
scraper = "0.29"
futures = "0.3"
regex = "1"
flate2 = "1"
roxmltree = "0.21"
base64 = "0.22"

[profile.dev]
# Keep debug builds usable for a crawler: dependencies optimised, our crates fast to rebuild.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2








