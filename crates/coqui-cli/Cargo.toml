[package]
name = "coqui-cli"
description = "Headless command-line crawler for Coqui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "coqui"
path = "src/main.rs"

[dependencies]
coqui-core.workspace = true
coqui-store.workspace = true
coqui-crawl.workspace = true
coqui-audit.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = "1.2.1"
serde = { workspace = true, features = ["derive"] }
coqui-report = { version = "0.1.0", path = "../coqui-report" }
serde_json.workspace = true
