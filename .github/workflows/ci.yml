name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust fmt + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all --check
      - name: Tests (core, store, crawl)
        run: cargo test -p coqui-core -p coqui-store -p coqui-crawl -p coqui-audit -p coqui-render -p coqui-lighthouse -p coqui-cli -p coqui-report

  web:
    name: Next.js static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build:web




  tauri-check:
    name: Tauri shell compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:web
      - run: cargo check -p coqui-app


  parity:
    name: Parity fixtures gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare committed fixtures
        run: >-
          node tools/parity/compare-exports.mjs
          --reference tools/parity/fixtures/reference
          --coqui tools/parity/fixtures/coqui
          --fail-under-ratio 1
          --max-mismatches 0
