name: Benchmarks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Storage benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore previous result
        uses: actions/cache/restore@v4
        with:
          path: bench-prev.json
          key: bench-result-${{ github.run_id }}
          restore-keys: |
            bench-result-
      - name: Build CLI
        run: cargo build -p coqui-cli
      - name: Run benchmark
        run: ./target/debug/coqui bench --urls 100000 --out bench-out --json > bench.json
      - name: Check budgets
        run: node tools/bench/check.mjs --input bench.json
      - name: Check regression
        if: hashFiles('bench-prev.json') != ''
        run: node tools/bench/compare.mjs --previous bench-prev.json --current bench.json --max-regression 0.10 --out bench-summary.md
      - name: Prepare result for caching
        if: hashFiles('bench.json') != ''
        run: cp bench.json bench-prev.json
      - name: Save result for next run
        if: hashFiles('bench-prev.json') != ''
        uses: actions/cache/save@v4
        with:
          path: bench-prev.json
          key: bench-result-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('bench.json') != ''
        with:
          name: bench-result
          path: bench.json



