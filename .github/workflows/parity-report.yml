name: Parity report

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    name: Generate parity report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate report
        run: |
          {
            echo "# Coqui parity report"
            echo ""
            echo "- Version: ${{ github.event.release.tag_name || github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            node tools/parity/compare-exports.mjs \
              --reference tools/parity/fixtures/reference \
              --coqui tools/parity/fixtures/coqui \
              --tolerance tools/parity/fixtures/tolerance.json \
              --require-counterparts \
              --max-mismatches 0
          } > parity-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.md
      - name: Attach report to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" parity-report.md --clobber

