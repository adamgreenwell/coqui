name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --release -p coqui-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/coqui.exe dist/coqui.exe
          else
            cp target/release/coqui dist/coqui
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Fetch sidecars
        run: npm run sidecars
      - name: Build desktop installer
        run: npm run build
      - name: Sign installers
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi
          foreach ($file in $files) {
            signtool sign /f cert.pfx /p "$env:WINDOWS_CERTIFICATE_PASSWORD" `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file.FullName
          }
          foreach ($file in $files) {
            signtool verify /pa $file.FullName
          }
          Remove-Item cert.pfx
      - name: Check installer size
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer produced' }
          $mb = [math]::Round($installer.Length / 1MB, 1)
          Write-Output "installer: $($installer.Name) $mb MB"
          if ($mb -gt 350) { throw "Installer exceeds the 350 MB budget: $mb MB" }
      - name: Upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Fetch sidecars
        run: npm run sidecars
      - name: Build desktop installer
        run: npm run build
      - name: Verify signature and notarization
        if: env.APPLE_SIGNING_IDENTITY != ''
        shell: bash
        run: |
          app=$(find src-tauri/target/release/bundle -name '*.app' -maxdepth 3 | head -n 1)
          dmg=$(find src-tauri/target/release/bundle -name '*.dmg' | head -n 1)
          if [ -n "$app" ]; then codesign --verify --deep --strict --verbose=2 "$app"; fi
          if [ -n "$dmg" ]; then xcrun stapler validate "$dmg"; fi
      - name: Check installer size
        shell: bash
        run: |
          file=$(find src-tauri/target/release/bundle -name '*.dmg' | head -n 1)
          if [ -z "$file" ]; then echo "No DMG produced"; exit 1; fi
          size_mb=$(( $(stat -f%z "$file") / 1048576 ))
          echo "installer: $file ${size_mb} MB"
          if [ "$size_mb" -gt 350 ]; then echo "Installer exceeds 350 MB"; exit 1; fi
      - name: Upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg

  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Fetch sidecars
        run: npm run sidecars
      - name: Build desktop installer
        run: npm run build
      - name: Check installer size
        shell: bash
        run: |
          file=$(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) | head -n 1)
          if [ -z "$file" ]; then echo "No Linux package produced"; exit 1; fi
          size_mb=$(( $(stat -c%s "$file") / 1048576 ))
          echo "installer: $file ${size_mb} MB"
          if [ "$size_mb" -gt 350 ]; then echo "Installer exceeds 350 MB"; exit 1; fi
      - name: Upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
