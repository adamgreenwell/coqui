services:
  coqui:
    build: .
    image: coqui:local
    ports:
      - "8787:8787"
    volumes:
      - coqui-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coqui-data:
